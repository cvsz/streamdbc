<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>StreamDBC Samsung TV</title>
  <style type="text/css">
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    #player { position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; padding: 0; background: #000; }
    #message { display: none; position: absolute; left: 3%; right: 3%; bottom: 4%; padding: 12px 16px; background: #111; color: #fff; font: 20px Arial, sans-serif; }
  </style>
</head>
<body>
  <video id="player" autoplay preload="auto" src="/tv/live/index.m3u8">
    Video playback is unavailable. Open /tv/live/index.m3u8 directly.
  </video>
  <div id="message">Connecting to live video...</div>
  <script type="text/javascript">
    (function () {
      var player = document.getElementById('player');
      var message = document.getElementById('message');
      var retryTimer = null;

      function showMessage(text) {
        message.innerHTML = text;
        message.style.display = 'block';
      }

      function hideMessage() {
        message.style.display = 'none';
      }

      function play() {
        try {
          player.load();
          var result = player.play();
          if (result && typeof result.catch === 'function') {
            result.catch(function () { showMessage('Press ENTER to start video'); });
          }
        } catch (error) {
          showMessage('Press ENTER to start video');
        }
      }

      function retry() {
        if (retryTimer !== null) {
          window.clearTimeout(retryTimer);
        }
        showMessage('Stream offline. Retrying...');
        retryTimer = window.setTimeout(play, 3000);
      }

      player.addEventListener('playing', hideMessage, false);
      player.addEventListener('error', retry, false);
      player.addEventListener('stalled', retry, false);

      document.onkeydown = function (event) {
        event = event || window.event;
        var code = event.keyCode || event.which;
        if (code === 13 || code === 415 || code === 19 || code === 403) {
          play();
          return false;
        }
        return true;
      };

      play();
    }());
  </script>
</body>
</html>
