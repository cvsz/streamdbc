<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src http: https: blob:; connect-src http: https:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>STREMDBC Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a1a;
      color: #e5edf8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .header {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 20px; font-weight: 600; }
    .back-btn {
      background: #1a1a2e;
      color: #e5edf8;
      border: 1px solid #31425f;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
    }
    .back-btn:hover { background: #252540; }
    .player-wrapper {
      width: 100%;
      max-width: 960px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      position: relative;
    }
    video { width: 100%; height: 100%; display: block; }
    .loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #8ea2bf;
      font-size: 18px;
    }
    .stream-info {
      width: 100%;
      max-width: 960px;
      margin-top: 16px;
      padding: 16px 20px;
      background: #1a1a2e;
      border-radius: 12px;
    }
    .stream-info h2 { font-size: 18px; margin-bottom: 4px; }
    .stream-info p { font-size: 13px; color: #8ea2bf; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 960px;
      margin-top: 12px;
    }
    .stat-item {
      text-align: center;
      padding: 12px;
      background: #1a1a2e;
      border-radius: 8px;
    }
    .stat-value { font-size: 22px; font-weight: 600; color: #667eea; }
    .stat-label { font-size: 11px; color: #8ea2bf; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>STREMDBC Player</h1>
    <button class="back-btn" id="backBtn">← Back to Dashboard</button>
  </div>

  <div class="player-wrapper">
    <video id="videoPlayer" controls autoplay></video>
    <div class="loading" id="loading">Loading stream...</div>
  </div>

  <div class="stream-info">
    <h2 id="streamTitle">Loading...</h2>
    <p id="streamDescription">Fetching stream information</p>
  </div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-value" id="viewersCount">-</div>
      <div class="stat-label">Viewers</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="bitrateValue">-</div>
      <div class="stat-label">Bitrate</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stateValue">-</div>
      <div class="stat-label">State</div>
    </div>
  </div>

  <script src="assets/hls.min.js"></script>
  <script src="player.js"></script>
</body>
</html>
