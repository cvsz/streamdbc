<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>StreamDBC TV</title>
  <style type="text/css">
    html, body {
      width: 960px;
      height: 540px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #message {
      position: absolute;
      left: 0;
      top: 235px;
      width: 960px;
      text-align: center;
      font-size: 24px;
    }
  </style>
  <script type="text/javascript">
    (function () {
      var target = "http://ztv.zeaz.dev:8081/tv/";

      function openStreamDBC() {
        try {
          window.location.replace(target);
        } catch (error) {
          window.location.href = target;
        }
      }

      if (window.addEventListener) {
        window.addEventListener("load", openStreamDBC, false);
      } else {
        window.onload = openStreamDBC;
      }
    }());
  </script>
</head>
<body>
  <div id="message">Opening StreamDBC TV...</div>
</body>
</html>
