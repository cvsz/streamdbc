name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-client-lock:
    name: Generate desktop lockfile
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/production-grade-2026-10-06'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: hardening/production-grade-2026-10-06
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts
      - name: Format changed Go sources
        run: |
          gofmt -w internal/api/server.go internal/api/server_test.go
          gofmt -w internal/config/config.go internal/config/config_test.go
          gofmt -w internal/ingest/webrtc/server.go internal/ingest/webrtc/server_test.go
      - name: Commit generated files
        shell: bash
        run: |
          git add client/package-lock.json internal/api internal/config internal/ingest/webrtc
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: generate lockfile and format hardening changes"
          git push origin HEAD:hardening/production-grade-2026-10-06

  test:
    name: Go test, vet, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Unit and race tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o /tmp/stremdbc ./cmd/stremdbc

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build --pull -t stremdbc:${{ github.sha }} .

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stremdbc-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stremdbc:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
