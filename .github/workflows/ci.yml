name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test, vet, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Unit and race tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o /tmp/stremdbc ./cmd/stremdbc

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose configuration
        env:
          STREMDBC_JWT_SECRET: 0123456789abcdef0123456789abcdef
          STREMDBC_API_KEY: api-key-123456789
          REDIS_PASSWORD: redis-password-123456789
          POSTGRES_PASSWORD: postgres-password-123456789
          GRAFANA_ADMIN_PASSWORD: grafana-password-123456789
        run: docker compose config --quiet

      - name: Build image
        run: docker build --pull -t stremdbc:${{ github.sha }} .

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stremdbc-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stremdbc:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
