name: Desktop Client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm audit and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Generate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit dependency lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(client): lock npm dependency graph"
          git push origin HEAD:hardening/production-grade-2026-10-06

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Vendor browser runtime
        run: npm run vendor

      - name: Verify vendored HLS
        run: test -s assets/hls.min.js

      - name: JavaScript syntax checks
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check player.js
          node --check build.js
          node --check scripts/vendor-hls.js

      - name: Reject remote runtime scripts
        run: |
          if grep -R -nE '<script[^>]+src="https?://' --include='*.html' .; then
            echo "Remote runtime script detected"
            exit 1
          fi
