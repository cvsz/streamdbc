name: Desktop Client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "scripts/windows/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm audit and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Vendor browser runtime
        run: npm run vendor

      - name: Verify vendored HLS
        run: test -s assets/hls.min.js

      - name: JavaScript syntax checks
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check player.js
          node --check build.js
          node --check scripts/vendor-hls.js

      - name: Reject remote runtime scripts
        run: |
          if grep -R -nE '<script[^>]+src="https?://' --include='*.html' .; then
            echo "Remote runtime script detected"
            exit 1
          fi


  build-windows:
    name: Windows installer and portable build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Vendor browser runtime
        run: npm run vendor

      - name: Syntax checks
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check player.js
          node --check build.js

      - name: Build Windows installer and portable app
        shell: pwsh
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Windows Control Panel
        uses: actions/upload-artifact@v4
        with:
          name: streamdbc-windows-control-panel
          path: |
            client/dist/*.exe
            client/dist/*.yml
          if-no-files-found: error
          retention-days: 14
