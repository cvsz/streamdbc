name: Desktop Client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "cmd/stremdbc/**"
      - "internal/**"
      - "configs/samsung-f5500.yaml"
      - "web/tv/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "cmd/stremdbc/**"
      - "internal/**"
      - "configs/samsung-f5500.yaml"
      - "web/tv/**"
      - "go.mod"
      - "go.sum"
      - "scripts/windows/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm audit and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies without vulnerable optional proxy chain
        run: npm ci --ignore-scripts --omit=optional

      - name: Audit installed dependency set
        run: npm audit --omit=optional --audit-level=moderate

      - name: Vendor browser runtime
        run: npm run vendor

      - name: Verify vendored HLS
        run: test -s assets/hls.min.js

      - name: JavaScript syntax checks
        run: |
          node --check main.js
          node --check window-lifecycle.js
          node --check preload.js
          node --check samsung-fleet.js
          node --check renderer.js
          node --check player.js
          node --check build.js
          node --check scripts/generate-windows-icon.js
          node --check scripts/prepare-server-runtime.js
          node --check scripts/vendor-hls.js

      - name: Run desktop lifecycle tests
        run: npm test

      - name: Reject remote runtime scripts
        run: |
          if grep -R -nE '<script[^>]+src="https?://' --include='*.html' .; then
            echo "Remote runtime script detected"
            exit 1
          fi

  build-windows:
    name: Windows installer and portable build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install locked dependencies without vulnerable optional proxy chain
        run: npm ci --omit=optional

      - name: Vendor browser runtime
        run: npm run vendor

      - name: Syntax checks
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check samsung-fleet.js
          node --check renderer.js
          node --check player.js
          node --check build.js
          node --check scripts/prepare-server-runtime.js

      - name: Build Windows installer, portable app, and bundled server runtime
        shell: pwsh
        run: ..\scripts\windows\full-build-installer.ps1 -SkipTests

      - name: Verify bundled server runtime
        shell: pwsh
        run: |
          if (-not (Test-Path assets/apps.ico)) { throw "Zeazdev apps.ico missing" }
          if (-not (Test-Path server-runtime/stremdbc.exe)) { throw "Bundled stremdbc.exe missing" }
          if (-not (Test-Path server-runtime/configs/samsung-f5500.yaml)) { throw "Samsung config missing" }
          if (-not (Test-Path server-runtime/web/tv/index.html)) { throw "TV web assets missing" }
          if (-not (Test-Path server-runtime/ffmpeg/ffmpeg.exe)) { throw "Bundled ffmpeg.exe missing" }
          if (-not (Test-Path server-runtime/ffmpeg/ffprobe.exe)) { throw "Bundled ffprobe.exe missing" }
          if (-not (Test-Path server-runtime/scripts/windows/samsung-tv-doctor.ps1)) { throw "Bundled doctor script missing" }
          $encoders = (& server-runtime/ffmpeg/ffmpeg.exe -hide_banner -encoders 2>&1 | Out-String)
          $muxers = (& server-runtime/ffmpeg/ffmpeg.exe -hide_banner -muxers 2>&1 | Out-String)
          $protocols = (& server-runtime/ffmpeg/ffmpeg.exe -hide_banner -protocols 2>&1 | Out-String)
          if ($encoders -notmatch "libx264") { throw "Bundled FFmpeg missing libx264" }
          if ($encoders -notmatch "(?m)^\s*[A-Z\.]{6}\s+aac\s") { throw "Bundled FFmpeg missing AAC encoder" }
          if ($muxers -notmatch "(?m)^\s*[A-Z\.]{1,3}\s+hls\s") { throw "Bundled FFmpeg missing HLS muxer" }
          if ($protocols -notmatch "(?m)^\s*rtmp\s*$") { throw "Bundled FFmpeg missing RTMP protocol" }

      - name: Upload Windows Control Panel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamdbc-windows-control-panel
          path: |
            client/dist/*.exe
            client/dist/*.yml
            client/dist/build-manifest.json
            client/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
