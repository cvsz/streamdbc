name: Security dependency tidy

on:
  push:
    branches:
      - fix/security-alerts-and-tv-ci
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/workflows/security-tidy.yml"

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/security-alerts-and-tv-ci
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Tidy modules
        run: go mod tidy
      - name: Commit generated module graph
        shell: bash
        run: |
          if git diff --quiet -- go.mod go.sum; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "security: tidy Pion v4 module graph"
          git push origin HEAD:fix/security-alerts-and-tv-ci
