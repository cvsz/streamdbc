name: Android TV

on:
  pull_request:
    paths:
      - "client/tv/**"
      - ".github/workflows/android-tv.yml"
  push:
    branches: [main]
    paths:
      - "client/tv/**"
      - ".github/workflows/android-tv.yml"

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client/tv

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: streamdbc-tv-debug
          path: client/tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
