name: Android TV

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "client/tv/**"
      - ".github/workflows/android-tv.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/tv/**"
      - ".github/workflows/android-tv.yml"

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client/tv
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint
        shell: bash
        run: |
          if ! gradle --no-daemon :app:lintDebug --console=plain; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "::group::Android lint report"
              cat "$report"
              echo "::endgroup::"
            fi
            exit 1
          fi

      - name: Assemble
        run: gradle --no-daemon :app:assembleDebug
