name: Samsung TV Gateway

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samsung-tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samsung-gateway:
    name: Go and synthetic HLS compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.2"
          cache: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Verify FFmpeg Samsung encoders
        run: |
          ffmpeg -hide_banner -h encoder=libx264
          ffmpeg -hide_banner -h encoder=aac

      - name: Verify modules and formatting
        run: |
          go mod verify
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi
          go mod tidy -diff

      - name: Validate Samsung F5500 kiosk and Legacy launcher
        shell: bash
        run: |
          grep -q 'http_port: 8081' configs/samsung-f5500.yaml
          grep -q 'http://ztv.zeaz.dev:8081/tv/' client/samsung-f5500-legacy/index.html
          grep -q '<fullwidget itemtype="boolean">y</fullwidget>' client/samsung-f5500-legacy/config.xml
          grep -q 'src="/tv/live/index.m3u8"' web/tv/index.html
          if grep -q '<video[^>]*controls' web/tv/index.html web/tv/basic.html; then
            echo "Samsung kiosk pages must not expose browser video controls"
            exit 1
          fi
          test -f client/samsung-f5500-legacy/widget.info
          test -f scripts/windows/build-samsung-f5500-usb.ps1

      - name: Validate vMix starter preset vocabulary
        run: |
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse('docs/streamdbc.vmix').getroot()
          assert root.tag == 'vmix'
          allowed = {'version','inputs','input','overlays','overlay','preview',
                     'active','fadeToBlack','transitions','transition',
                     'recording','external','streaming','playList','multiCorder'}
          for el in root.iter():
              if el is not root:
                  assert el.tag in allowed, f'unverified element: {el.tag}'
          inputs = root.find('inputs')
          assert inputs is not None and len(inputs) == 1
          assert inputs[0].get('type') == 'Blank'
          for tag in ('recording','external','streaming','playList','multiCorder'):
              assert root.find(tag).text == 'False', tag
          print('vMix preset vocabulary OK')
          EOF

      - name: Go unit, race, API, and FFmpeg integration tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Staticcheck
        run: GOTOOLCHAIN=go1.27.1 go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...

      - name: Vet and build
        run: |
          go vet ./...
          go build -trimpath -o /tmp/stremdbc-samsung ./cmd/stremdbc
